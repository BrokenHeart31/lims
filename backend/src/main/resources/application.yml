server:
  port: 8080
  # 与前端 vite 代理（/api -> localhost:8080，无 rewrite）对齐：
  # 后端所有接口统一以 /api 前缀对外，契约见 docs/api/api-spec.md
  servlet:
    context-path: /api

spring:
  application:
    name: lims
  profiles:
    # 真实环境差异配置放 application-dev.yml（已 gitignore，禁止提交真实口令）
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 采样单 Excel 导入（T-301）+ AI 标准库文本文件上传（A-06，单文件可到几十 MB）
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    # 开发环境默认本地库（AGENTS.md 约定的实训账号，仅限本机开发）；
    # 任何非本机环境必须通过 application-dev.yml 覆盖，禁止把真实口令提交进本文件
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：characterEncoding 是 Java 字符集名，必须写 utf8（写 utf8mb4 会被 Connector/J 拒绝：
    # Unsupported character encoding 'utf8mb4'）；库表侧 utf8mb4 由 DDL 与连接协商保证
    url: jdbc:mysql://localhost:3306/lims?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 11111111

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 新表规范（AGENTS.md 6.1）：逻辑删除字段 deleted，0 未删 / 1 已删。
      #
      # ⚠️ 2026-09-17「失效标记升级为行自身 id」不影响本处配置（设计 §2.9）：
      #   `sample_item` / `sample_result` 的 deleted 列已改 BIGINT，失效时置为「该行自身 id」，
      #   但这**不依赖** MP 的自动删除值——MP 的 @TableLogic 只支持固定字面量 (logic-delete-value)，
      #   无法表达「行自身 id」。故这两张表的逻辑删除**一律改走
      #   service/rollback/SampleDataDisposer 显式 `set(deleted, id)`**，禁止 baseMapper.delete(...)。
      #   对**读写路径**而言，MP 只需 deleted = 0 表示有效（logic-not-delete-value），
      #   与列类型无关；其余表仍保持 0/1 两态，本处 logic-delete-value=1 继续生效。
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（骨架；secret 为开发默认值，生产必须经 application-dev.yml 覆盖）
lims:
  jwt:
    # HS256 要求密钥 >= 32 字节；以下为开发占位串，非真实密钥
    secret: lims-dev-only-secret-key-do-not-use-in-prod-0123456789abcdef
    # access_token 有效期（秒）：2 小时
    access-token-ttl: 7200
    # refresh_token 有效期（秒）：7 天
    refresh-token-ttl: 604800
    header: Authorization
    token-prefix: "Bearer "

  # ---------------------------------------------------------------------------
  # 检验报告模板配置（T-702）
  # 为什么放配置而不是硬编码：机构名称、资质证书号、联系方式属于**资质与主体信息**，
  # 会随复评/换证变化；写死在 Java 里意味着「换个中心就要改代码重新发版」。
  # 下列默认值取自业务说明书内嵌的报告样例（不是编造的）：
  #   · cma-no   181004090030                    —— CMA 资质认定证书编号
  #   · catl-no  [2020]农质检核（苏）字第0021号    —— 农产品质量安全检测机构考核合格证书号（CATL）
  # 报告按类型渲染：CMA 报告只显示 cma-no；CMA-CATL 报告显示 cma-no + catl-no 两行。
  # ⚠️ 生产部署必须由使用单位核对并覆盖为真实有效证书号。
  # ---------------------------------------------------------------------------
  report:
    # 出具机构名称（报告封面与页眉）
    org-name: 南通市食品质量检验测试中心
    # CMA 资质认定证书编号（报告封面资质行第 1 行）
    cma-no: "181004090030"
    # CATL 考核合格证书号（仅 CMA-CATL 报告显示，为第 2 行）
    catl-no: "[2020]农质检核（苏）字第0021号"
    address: 南通市通州区江海大道18号
    phone: 0513-83548999
    postcode: "226011"
    fax: 0513-83548888
    # 实验环境条件（报告第 1 页固定栏，实验室按实际条件覆盖）
    environment: 温度：20℃-25℃  湿度：40%-60%
    # 报告注意事项（封面右侧固定条款，逐条渲染并自动编号）
    notes:
      - 报告无“检验报告专用章”或检验单位公章无效。
      - 复制报告未重新加盖“检验报告专用章”和检验单位公章无效。
      - 报告无制表、审核、批准人签字无效。
      - 报告涂改无效。
      - 对检验报告若有异议，应于收到报告之日起五日内向检验单位提出，逾期不予受理。
      - 委托检验仅对来样负责。
      - 未经本中心同意，该检验报告不得用于商业性宣传。

  # ---------------------------------------------------------------------------
  # 本地 AI 助手配置（feature A，T03；本批 T01 先落配置位）
  # 为什么放配置：base-url / 模型名 / 上下文预算属**部署差异**（本机端口、量化版本、
  #   内存大小），写死进代码意味着「换台机器就要改代码重发版」。
  # 零外发：base-url 固定回环口 127.0.0.1，Ollama 为仓库内独立进程（ai/runtime/）。
  # ---------------------------------------------------------------------------
  ai:
    # 本地 Ollama 服务地址（仅回环口，禁改外网地址）
    base-url: http://127.0.0.1:11434
    # 使用的模型（非思考变体 + think=false 双保险，避免  thinking 污染展示并降延迟）
    model: qwen3:4b-instruct
    # 是否请求模型「不思考」（qwen3 系），交互式助手必须为 true
    think: false
    # 单次对话请求超时（毫秒）；CPU 推理慢，给足预算
    timeout-ms: 300000
    # 健康检查超时（毫秒）：短超时 fail-soft，离线时快速返回 4201
    health-timeout-ms: 1500
    # GB 检索默认返回条数（top-N）
    top-n: 5
    # 投喂模型的标准条款正文预算（字符数，保守估算即可，不引 tokenizer）
    max-context-chars: 3000
    # 会话在客户端保留的最近消息条数（上下文窗口）
    history-limit: 6
    # GB 标准库根目录（含 inbox/ 与 parsed/ 子目录）；相对路径按「进程 CWD → 逐级上溯」解析，
    # 便于后端既能在仓库根启动、也能在 backend/ 下启动（见 GbIndexServiceImpl.resolveDir）。
    standards-dir: ai/standards
    # 离线时展示给用户的启动指引脚本
    start-script: ai/scripts/start-ollama.ps1
    # OCR 侧车位目录（feature 增量 ai_flow_assistant）：逐页片段 + progress.json，供
    #   GET /api/ai/kb/scan/jobs 读取页级进度（只读）；相对路径按「进程 CWD → 逐级上溯」解析。
    scan-dir: ai/standards/.scan
    # 流程引导（feature 增量）：事实层恒为确定性代码；措辞层（模型润色）**默认关闭**。
    #   关闭时 answer 文本也由代码装配（零幻觉、离线可用）；开启时模型仅产出散文，
    #   结构化事实字段依旧原样下发（前端与单测以结构化字段为准）。
    flow:
      phrasing-enabled: false
    # 标准伴随查询（feature 增量）：默认开启（用户明确要「自动查询」）；前端另有会话级开关。
    companion:
      enabled: true
    # 护栏词表（R5 可热配置）：与 DomainGuard 内置默认词表**合并**（增量，不覆盖）。
    #   业务域/标准域命中即为对应域；chitchat 命中即 100% 拒答；都无法判定才交模型分类。
    guard-lexicon:
      business:
        - 我的权限
        - 下一步
        - 怎么走
        - 流程
        - 链路
        - 步骤
        - 分几步
        - 我要做
        - 走一遍
      standard:
        - 限量
        - 检出限
        - 判定依据
      chitchat:
        - 天气
        - 股票
        - 讲个笑话
        - 写代码

logging:
  level:
    com.lims: info
