# =============================================================================
# 本地 AI 助手 · Ollama 运行时配置（feature A / T04）
# -----------------------------------------------------------------------------
# 本文件是「脚本层的默认值来源」：ai/scripts/{deploy,start,status}-ollama.ps1
# 会读取下列**顶层键值**（仅支持 key: value，不支持嵌套/列表——脚本不引 YAML 模块）。
# 后端侧的 AI 配置在 backend/src/main/resources/application.yml 的 lims.ai.*
# （两者含义一致：host/port/model 指向同一 Ollama；改端口时**两处都要改**）。
# =============================================================================

# 监听地址（仅回环口；零外发红线，禁止改成 0.0.0.0 或外网地址）
host: 127.0.0.1
port: 11434

# 使用的模型：qwen3 的**非思考变体**（instruct）。Q4_K_M 量化约 2.5GB；
# 选它的理由：4B 规模在本机 CPU 上可交互式响应；instruct 变体 + think=false
# 避免 思考过程 污染展示（详见设计 §2.4）。
model: qwen3:4b-instruct

# 是否请求模型「不思考」（qwen3 系支持）；交互式助手必须 false
think: false

# 模型权重目录（相对于仓库根）
models_dir: ai/models

# 单次对话超时（秒）：CPU 推理慢，给足预算；超时由后端返回业务码 4203
request_timeout_sec: 300

# 健康检查超时（毫秒）：短超时 fail-soft，离线时快速降级
health_timeout_ms: 1500
